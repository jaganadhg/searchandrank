[project]
name = "literank"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.0",
    "datasets>=2.20",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "torch>=2.5.1",
    "tqdm>=4.66",
    "transformers>=4.44",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
